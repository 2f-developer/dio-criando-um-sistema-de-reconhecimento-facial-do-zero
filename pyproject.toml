[project]
name = "reconhecimento-facial"
version = "1.0.0"
description = "Detecção de faces com YuNet e reconhecimento com uma rede de classificação treinada em TensorFlow."
requires-python = ">=3.10"
dependencies = ["tensorflow>=2.16", "opencv-python>=4.8", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["faces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]
